name: dependency-review
# Tandem ships with zero runtime dependencies; this guards against one being added unreviewed.
on: pull_request
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
      - name: no runtime dependencies
        run: node -e "const p=require('./package.json');if(Object.keys(p.dependencies||{}).length){console.error('runtime dependencies are not allowed:',p.dependencies);process.exit(1)}"
